<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💕 دردشة الحب - محمد و عالية</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Tahoma',sans-serif; }
body {
  background: linear-gradient(135deg,#ff9a9e,#fad0c4,#ffecd2);
  min-height:100vh; display:flex; justify-content:center; align-items:center;
  overflow:hidden;
}
.hearts { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
.heart { position:absolute; color:#ff4b6e; animation: float 8s linear infinite; opacity:0.6; }
@keyframes float {
  0% { transform: translateY(100vh) scale(0.5); opacity:0; }
  50% { opacity:0.8; }
  100% { transform: translateY(-10vh) scale(1.2); opacity:0; }
}

/* شاشة الدخول */
.login-box {
  background: rgba(255,255,255,0.97); padding:35px; border-radius:25px;
  box-shadow:0 20px 60px rgba(255,75,110,0.4); text-align:center;
  z-index:10; width:90%; max-width:400px; border:3px solid #ff4b6e;
}
.login-box h1 { color:#ff4b6e; margin-bottom:8px; font-size:26px; }
.login-box p { color:#666; margin-bottom:20px; font-size:14px; }
.login-box input, .login-box select {
  width:100%; padding:13px; border:2px solid #ffb6c1; border-radius:15px;
  font-size:15px; margin-bottom:12px; text-align:center; outline:none;
}
.login-box button {
  width:100%; padding:13px; background:linear-gradient(135deg,#ff4b6e,#ff8fab);
  color:white; border:none; border-radius:15px; font-size:16px; font-weight:bold;
  cursor:pointer; margin-top:5px;
}
.login-box button:hover { transform:scale(1.03); }
.error { color:#e74c3c; margin-top:8px; font-size:13px; min-height:18px; }
.info-box { background:#fff0f3; padding:10px; border-radius:10px; margin:10px 0; font-size:12px; color:#c44569; }

/* التطبيق */
.app { display:none; width:100%; max-width:500px; height:100vh; background:white;
  flex-direction:column; position:relative; z-index:10; }
.app.active { display:flex; }

.header {
  background:linear-gradient(135deg,#ff4b6e,#ff8fab); color:white;
  padding:12px 15px; display:flex; align-items:center; gap:10px;
  box-shadow:0 4px 15px rgba(255,75,110,0.3);
}
.avatar {
  width:45px; height:45px; border-radius:50%; background:white;
  display:flex; align-items:center; justify-content:center;
  font-size:22px; border:3px solid #fff;
}
.header-info { flex:1; }
.header-info h3 { font-size:16px; }
.header-info span { font-size:11px; opacity:0.9; }
.status-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-left:5px; }
.status-online { background:#4ade80; }
.status-offline { background:#999; }
.status-connecting { background:#fbbf24; animation:blink 1s infinite; }
@keyframes blink { 50% { opacity:0.3; } }

.call-btns { display:flex; gap:6px; }
.call-btns button {
  width:38px; height:38px; border-radius:50%; border:none;
  background:rgba(255,255,255,0.25); color:white; font-size:17px; cursor:pointer;
}
.logout {
  background:rgba(255,255,255,0.2); border:none; color:white;
  padding:5px 10px; border-radius:10px; cursor:pointer; font-size:11px;
}

/* الرسائل */
.messages {
  flex:1; overflow-y:auto; padding:15px; background:#fff5f7;
  display:flex; flex-direction:column; gap:8px;
}
.msg { max-width:75%; padding:10px 14px; border-radius:18px;
  font-size:14px; line-height:1.5; animation: pop 0.3s ease; word-wrap:break-word; }
@keyframes pop { from{transform:scale(0.5);opacity:0;} to{transform:scale(1);opacity:1;} }
.msg.me { align-self:flex-end; background:linear-gradient(135deg,#ff4b6e,#ff8fab);
  color:white; border-bottom-right-radius:5px; }
.msg.other { align-self:flex-start; background:white; color:#333;
  border-bottom-left-radius:5px; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
.msg .time { font-size:10px; opacity:0.7; margin-top:3px; display:block; }
.msg .sender { font-size:10px; opacity:0.8; margin-bottom:2px; display:block; font-weight:bold; }
.msg.love { background:linear-gradient(135deg,#ff6b9d,#c44569); color:white; }
.msg.audio { display:flex; flex-direction:column; gap:5px; min-width:200px; }
.msg.audio audio { height:32px; width:100%; }
.msg.sticker { font-size:55px; background:transparent; padding:5px; box-shadow:none; }
.msg img { max-width:100%; border-radius:12px; }

.system-msg { text-align:center; color:#ff4b6e; font-size:12px; margin:5px 0; opacity:0.7; }

/* شريط الإدخال */
.input-bar {
  padding:8px; background:white; border-top:1px solid #ffe0e6;
  display:flex; gap:6px; align-items:center;
}
.input-bar button {
  width:40px; height:40px; border-radius:50%; border:none;
  background:#fff0f3; color:#ff4b6e; font-size:17px; cursor:pointer; flex-shrink:0;
}
.input-bar button:hover { background:#ff4b6e; color:white; }
.input-bar input {
  flex:1; padding:9px 12px; border:2px solid #ffe0e6; border-radius:20px;
  outline:none; font-size:14px; min-width:0;
}
.send-btn { background:linear-gradient(135deg,#ff4b6e,#ff8fab)!important; color:white!important; }

/* الملصقات */
.stickers-panel {
  display:none; background:white; padding:8px; border-top:1px solid #ffe0e6;
  max-height:140px; overflow-y:auto;
  grid-template-columns:repeat(7,1fr); gap:3px;
}
.stickers-panel.active { display:grid; }
.stickers-panel span {
  font-size:26px; text-align:center; cursor:pointer; padding:4px;
  border-radius:8px;
}
.stickers-panel span:hover { background:#ffe0e6; transform:scale(1.2); }

/* نافذة المكالمة */
.call-modal {
  display:none; position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.9); z-index:100;
  justify-content:center; align-items:center; flex-direction:column; color:white;
}
.call-modal.active { display:flex; }
.call-avatar {
  width:130px; height:130px; border-radius:50%; background:linear-gradient(135deg,#ff4b6e,#ff8fab);
  display:flex; align-items:center; justify-content:center; font-size:60px;
  margin-bottom:20px; animation:pulse 1.5s infinite;
}
@keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.1);} }
.call-modal h2 { font-size:24px; margin-bottom:8px; }
.call-modal p { opacity:0.8; margin-bottom:25px; }
.call-controls { display:flex; gap:15px; }
.call-controls button {
  width:55px; height:55px; border-radius:50%; border:none; font-size:22px;
  cursor:pointer; color:white;
}
.end-call { background:#e74c3c; }
.mute-call { background:#3498db; }

/* الفيديو */
.video-container {
  display:none; position:fixed; top:0; left:0; width:100%; height:100%;
  background:black; z-index:100;
}
.video-container.active { display:flex; flex-direction:column; }
.video-container video { flex:1; background:#000; object-fit:cover; }
.video-container .self-video {
  position:absolute; top:20px; left:20px; width:110px; height:150px;
  border-radius:12px; border:3px solid #ff4b6e; object-fit:cover; z-index:2;
}
.video-header {
  position:absolute; top:20px; right:20px; color:white;
  background:rgba(0,0,0,0.5); padding:8px 14px; border-radius:18px; z-index:2;
}
.video-controls {
  position:absolute; bottom:25px; left:50%; transform:translateX(-50%);
  display:flex; gap:12px; z-index:2;
}
.video-controls button {
  width:50px; height:50px; border-radius:50%; border:none;
  font-size:20px; cursor:pointer; color:white;
}

/* إشعار مكالمة واردة */
.incoming-call {
  display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background:white; padding:15px 20px; border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3); z-index:200;
  text-align:center; min-width:280px;
}
.incoming-call.active { display:block; animation:slideUp 0.3s; }
@keyframes slideUp { from{transform:translate(-50%,100%);} to{transform:translate(-50%,0);} }
.incoming-call h3 { color:#ff4b6e; margin-bottom:10px; }
.incoming-call button {
  padding:8px 20px; border:none; border-radius:15px; margin:0 5px;
  font-size:14px; cursor:pointer; color:white;
}
.accept-call { background:#4ade80; }
.reject-call { background:#e74c3c; }

/* شريط الحالة */
.status-bar {
  background:#fff0f3; padding:6px; text-align:center; font-size:12px;
  color:#c44569; border-bottom:1px solid #ffe0e6;
}
</style>
</head>
<body>

<div class="hearts" id="hearts"></div>

<!-- شاشة تسجيل الدخول -->
<div class="login-box" id="loginBox">
  <h1>💕 دردشة الحب 💕</h1>
  <p>تطبيق خاص بين محمد و عالية</p>
  
  <div class="info-box">
    🔐 كلمة السر: <b>love2026</b><br>
    <small>افتح نفس الرابط على جهازين مختلفين</small>
  </div>
  
  <input type="password" id="password" placeholder="🔐 كلمة السر">
  <select id="userSelect">
    <option value="">— اختر من أنت —</option>
    <option value="mohamed">محمد الجندي (736088965)</option>
    <option value="alia">عالية الكمالي (+967775768834)</option>
  </select>
  <button onclick="login()">دخول 💖</button>
  <div class="error" id="error"></div>
</div>

<!-- التطبيق -->
<div class="app" id="app">
  <div class="header">
    <button class="logout" onclick="logout()">خروج</button>
    <div class="avatar" id="otherAvatar">💝</div>
    <div class="header-info">
      <h3 id="otherName">جاري الاتصال...</h3>
      <span id="otherStatus"><span class="status-dot status-connecting"></span>جاري الاتصال</span>
    </div>
    <div class="call-btns">
      <button onclick="startCall('audio')" title="مكالمة صوتية">📞</button>
      <button onclick="startCall('video')" title="مكالمة فيديو">📹</button>
    </div>
  </div>
  
  <div class="status-bar" id="statusBar">🔄 جاري الاتصال بالخادم...</div>

  <div class="messages" id="messages"></div>

  <div class="stickers-panel" id="stickers"></div>

  <div class="input-bar">
    <button onclick="toggleStickers()" title="ملصقات">😊</button>
    <button onclick="document.getElementById('fileInput').click()" title="صورة">🖼️</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="sendImage(event)">
    <button id="micBtn" onclick="toggleRecord()" title="تسجيل صوتي">🎤</button>
    <input type="text" id="msgInput" placeholder="اكتب رسالة..." onkeypress="if(event.key==='Enter')sendMessage()">
    <button onclick="sendLove()" title="رسالة حب">💌</button>
    <button class="send-btn" onclick="sendMessage()">➤</button>
  </div>
</div>

<!-- نافذة المكالمة الصوتية -->
<div class="call-modal" id="callModal">
  <div class="call-avatar" id="callAvatar">💝</div>
  <h2 id="callName">عالية</h2>
  <p id="callStatus">جاري الاتصال...</p>
  <div class="call-controls">
    <button class="mute-call" onclick="toggleMute()" id="muteBtn">🎤</button>
    <button class="end-call" onclick="endCall()">📴</button>
  </div>
</div>

<!-- نافذة الفيديو -->
<div class="video-container" id="videoModal">
  <video id="remoteVideo" autoplay playsinline></video>
  <video class="self-video" id="selfVideo" autoplay playsinline muted></video>
  <div class="video-header">
    <span id="videoName">عالية</span> | <span id="videoTime">00:00</span>
  </div>
  <div class="video-controls">
    <button style="background:#3498db;" onclick="toggleVideoMute()">🎤</button>
    <button style="background:#9b59b6;" onclick="toggleCamera()">📷</button>
    <button style="background:#e74c3c;" onclick="endVideoCall()">📴</button>
  </div>
</div>

<!-- إشعار مكالمة واردة -->
<div class="incoming-call" id="incomingCall">
  <h3>📞 مكالمة واردة</h3>
  <p id="incomingCaller">محمد يتصل بك...</p>
  <button class="accept-call" onclick="acceptIncomingCall()">✓ قبول</button>
  <button class="reject-call" onclick="rejectIncomingCall()">✗ رفض</button>
</div>

<audio id="ringtone" loop>
  <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdH2LkZGBdmuFg4eMkZaXmZyio6OjpqWkpaeoqauura2srq+wsbKztbe4ubu8vb6/wMHExcbHyMrMzs/R0tPV2Nrc3t/h4uTl5ufo6err7+3v8fLz9ff4+fr7/Pz9/v4=" type="audio/wav">
</audio>

<script>
// ========== البيانات ==========
const USERS = {
  mohamed: { 
    name:'محمد الجندي', 
    phone:'736088965', 
    avatar:'👨', 
    peerId:'mohamed-love-736088965'
  },
  alia: { 
    name:'عالية الكمالي', 
    phone:'+967775768834', 
    avatar:'💝',
    peerId:'alia-love-775768834'
  }
};

const LOVE_MESSAGES = [
  'أحبك يا عمري ❤️','أنتِ نور عيني 🌹','كل يوم معك هدية 💕',
  'قلبي ينبض باسمك 💓','أنتِ أجمل ما حدث لي 🌸','حبي لك لا ينتهي 💖',
  'أنتِ حياتي كلها 🌷','معك أشعر بالسعادة 💝','أحببتك بالأمس وسأحبك غداً 💘',
  'أنتِ كل الدنيا 💗'
];

const STICKERS = ['❤️','💕','💖','💗','💓','💝','💘','💞','💟','❣️','🌹','🌸','🌺','🌷','💐','😍','🥰','😘','💋','👩‍❤️‍👨','💑','💏','🫶','🤗','🌟','✨','🦋','🕊️','🌈','☀️','🌙','⭐','🎉','🎊'];

// ========== المتغيرات ==========
let currentUser = null;
let otherUser = null;
let peer = null;
let conn = null;
let currentCall = null;
let localStream = null;
let callTimer = null;
let callSeconds = 0;
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let incomingCallData = null;

// ========== القلوب ==========
function createHearts() {
  const container = document.getElementById('hearts');
  for (let i = 0; i < 12; i++) {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.innerHTML = ['❤️','💕','💖','💗'][Math.floor(Math.random()*4)];
    heart.style.left = Math.random()*100 + '%';
    heart.style.animationDelay = Math.random()*8 + 's';
    heart.style.fontSize = (15 + Math.random()*20) + 'px';
    container.appendChild(heart);
  }
}
createHearts();

// ========== تسجيل الدخول ==========
function login() {
  const pwd = document.getElementById('password').value;
  const userKey = document.getElementById('userSelect').value;
  const err = document.getElementById('error');
  
  if (pwd !== 'love2026') {
    err.textContent = '❌ كلمة السر غير صحيحة!';
    return;
  }
  if (!userKey) {
    err.textContent = '❌ اختر اسمك!';
    return;
  }
  
  currentUser = USERS[userKey];
  otherUser = userKey === 'mohamed' ? USERS.alia : USERS.mohamed;
  
  document.getElementById('otherName').textContent = otherUser.name;
  document.getElementById('otherAvatar').textContent = otherUser.avatar;
  document.getElementById('callName').textContent = otherUser.name;
  document.getElementById('callAvatar').textContent = otherUser.avatar;
  document.getElementById('videoName').textContent = otherUser.name;
  
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('app').classList.add('active');
  
  loadStickers();
  initPeer();
}

function logout() {
  if (confirm('هل تريد الخروج؟')) location.reload();
}

// ========== PeerJS - الاتصال الحقيقي ==========
function initPeer() {
  setStatus('🔄 جاري الاتصال بالخادم...', 'connecting');
  
  // إنشاء Peer بـ ID ثابت لكل مستخدم
  peer = new Peer(currentUser.peerId, {
    debug: 1,
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' }
      ]
    }
  });
  
  peer.on('open', (id) => {
    console.log('✅ متصل بـ PeerJS مع ID:', id);
    setStatus('🟢 متصل - في انتظار الطرف الآخر...', 'connecting');
    connectToOther();
  });
  
  peer.on('connection', (connection) => {
    conn = connection;
    setupConnection();
  });
  
  peer.on('call', (call) => {
    // مكالمة واردة
    incomingCallData = call;
    const type = call.metadata && call.metadata.type ? call.metadata.type : 'audio';
    document.getElementById('incomingCaller').textContent = 
      otherUser.name + ' يتصل بك... (' + (type === 'video' ? '📹 فيديو' : '📞 صوت') + ')';
    document.getElementById('incomingCall').classList.add('active');
    try { document.getElementById('ringtone').play(); } catch(e){}
  });
  
  peer.on('error', (err) => {
    console.error('خطأ:', err);
    if (err.type === 'unavailable-id') {
      setStatus('⚠️ الحساب مستخدم على جهاز آخر. أغلق التطبيق من الجهاز الآخر.', 'offline');
    } else if (err.type === 'peer-unavailable') {
      setStatus('⚠️ الطرف الآخر غير متصل. تأكد أنه فتح الرابط أيضاً.', 'offline');
      setTimeout(connectToOther, 5000);
    } else {
      setStatus('⚠️ خطأ: ' + err.type, 'offline');
    }
  });
  
  peer.on('disconnected', () => {
    setStatus('🔴 انقطع الاتصال - جاري إعادة المحاولة...', 'offline');
    peer.reconnect();
  });
}

function connectToOther() {
  if (conn) return;
  try {
    conn = peer.connect(otherUser.peerId, { reliable: true });
    setupConnection();
  } catch(e) {
    console.error(e);
  }
}

function setupConnection() {
  conn.on('open', () => {
    setStatus('✅ متصل مع ' + otherUser.name, 'online');
    addSystemMsg('🎉 تم الاتصال! يمكنكما التحدث الآن');
    conn.send({ type:'hello', from: currentUser.name });
  });
  
  conn.on('data', (data) => {
    handleData(data);
  });
  
  conn.on('close', () => {
    setStatus('🔴 انقطع الاتصال بالطرف الآخر', 'offline');
    addSystemMsg('⚠️ غادر الطرف الآخر');
    conn = null;
    setTimeout(connectToOther, 3000);
  });
  
  conn.on('error', (err) => {
    console.error('خطأ اتصال:', err);
  });
}

function handleData(data) {
  if (!data || !data.type) return;
  
  switch(data.type) {
    case 'hello':
      addSystemMsg('👋 ' + data.from + ' متصل الآن');
      break;
    case 'message':
      addMessage(data.text, 'other', false, 'text', data.sender);
      break;
    case 'love':
      addMessage(data.text, 'other', true, 'text', data.sender);
      break;
    case 'sticker':
      addMessage(data.sticker, 'other', false, 'sticker', data.sender);
      break;
    case 'image':
      addImageMessage(data.image, 'other', data.sender);
      break;
    case 'audio':
      addAudioMessage(data.audio, 'other', data.sender);
      break;
    case 'call-request':
      // تم التعامل معها عبر peer.on('call')
      break;
    case 'call-end':
      endCall();
      endVideoCall();
      break;
  }
}

function setStatus(text, state) {
  const status = document.getElementById('otherStatus');
  const bar = document.getElementById('statusBar');
  const dotClass = state === 'online' ? 'status-online' : 
                   state === 'connecting' ? 'status-connecting' : 'status-offline';
  status.innerHTML = '<span class="status-dot ' + dotClass + '"></span>' + text;
  bar.textContent = text;
}

// ========== الملصقات ==========
function loadStickers() {
  const panel = document.getElementById('stickers');
  STICKERS.forEach(s => {
    const span = document.createElement('span');
    span.textContent = s;
    span.onclick = () => sendSticker(s);
    panel.appendChild(span);
  });
}

function toggleStickers() {
  document.getElementById('stickers').classList.toggle('active');
}

function sendSticker(s) {
  addMessage(s, 'me', false, 'sticker');
  if (conn && conn.open) {
    conn.send({ type:'sticker', sticker:s, sender:currentUser.name });
  } else {
    alert('⚠️ الطرف الآخر غير متصل');
  }
}

// ========== الرسائل ==========
function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  if (!conn || !conn.open) {
    alert('⚠️ الطرف الآخر غير متصل حالياً');
    return;
  }
  addMessage(text, 'me');
  conn.send({ type:'message', text:text, sender:currentUser.name });
  input.value = '';
}

function sendLove() {
  if (!conn || !conn.open) {
    alert('⚠️ الطرف الآخر غير متصل');
    return;
  }
  const msg = LOVE_MESSAGES[Math.floor(Math.random()*LOVE_MESSAGES.length)];
  addMessage(msg, 'me', true);
  conn.send({ type:'love', text:msg, sender:currentUser.name });
}

function addMessage(text, sender, isLove=false, type='text', senderName=null) {
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + sender + (isLove?' love':'') + (type==='sticker'?' sticker':'');
  const time = new Date().toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
  
  let html = '';
  if (sender === 'other' && senderName) {
    html += '<span class="sender">' + senderName + '</span>';
  }
  if (type === 'sticker') {
    html += text;
  } else {
    html += text + '<span class="time">' + time + '</span>';
  }
  div.innerHTML = html;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function addSystemMsg(text) {
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'system-msg';
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function addImageMessage(base64, sender, senderName) {
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + sender;
  const time = new Date().toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
  let html = '';
  if (sender === 'other' && senderName) html += '<span class="sender">' + senderName + '</span>';
  html += '<img src="'+base64+'"><span class="time">'+time+'</span>';
  div.innerHTML = html;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function addAudioMessage(base64, sender, senderName) {
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + sender + ' audio';
  const time = new Date().toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
  let html = '';
  if (sender === 'other' && senderName) html += '<span class="sender">' + senderName + '</span>';
  html += '🎵 رسالة صوتية<audio controls src="'+base64+'"></audio><span class="time">'+time+'</span>';
  div.innerHTML = html;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function sendImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (!conn || !conn.open) { alert('⚠️ الطرف الآخر غير متصل'); return; }
  
  const reader = new FileReader();
  reader.onload = (ev) => {
    addImageMessage(ev.target.result, 'me');
    // ضغط الصورة إذا كانت كبيرة
    let imgData = ev.target.result;
    conn.send({ type:'image', image:imgData, sender:currentUser.name });
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

// ========== التسجيل الصوتي ==========
async function toggleRecord() {
  const btn = document.getElementById('micBtn');
  if (!isRecording) {
    if (!conn || !conn.open) { alert('⚠️ الطرف الآخر غير متصل'); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const blob = new Blob(audioChunks, {type:'audio/webm'});
        const reader = new FileReader();
        reader.onload = () => {
          addAudioMessage(reader.result, 'me');
          conn.send({ type:'audio', audio:reader.result, sender:currentUser.name });
        };
        reader.readAsDataURL(blob);
        stream.getTracks().forEach(t => t.stop());
      };
      mediaRecorder.start();
      isRecording = true;
      btn.style.background = '#e74c3c';
      btn.style.color = 'white';
      btn.textContent = '⏹️';
    } catch(err) {
      alert('لا يمكن الوصول للميكروفون');
    }
  } else {
    mediaRecorder.stop();
    isRecording = false;
    btn.style.background = '#fff0f3';
    btn.style.color = '#ff4b6e';
    btn.textContent = '🎤';
  }
}

// ========== المكالمات ==========
async function startCall(type) {
  if (!peer || !conn || !conn.open) {
    alert('⚠️ الطرف الآخر غير متصل');
    return;
  }
  
  try {
    const constraints = type === 'video' ? {video:true, audio:true} : {audio:true};
    localStream = await navigator.mediaDevices.getUserMedia(constraints);
    
    if (type === 'video') {
      document.getElementById('selfVideo').srcObject = localStream;
      document.getElementById('videoModal').classList.add('active');
    } else {
      document.getElementById('callModal').classList.add('active');
      document.getElementById('callStatus').textContent = 'جاري الاتصال...';
    }
    
    currentCall = peer.call(otherUser.peerId, localStream, {
      metadata: { type: type, from: currentUser.name }
    });
    
    setupCallHandlers(currentCall, type);
  } catch(err) {
    alert('لا يمكن الوصول للكاميرا/الميكروفون: ' + err.message);
  }
}

function setupCallHandlers(call, type) {
  call.on('stream', (remoteStream) => {
    if (type === 'video') {
      document.getElementById('remoteVideo').srcObject = remoteStream;
      document.getElementById('callStatus').textContent = 'متصل';
    } else {
      document.getElementById('callStatus').textContent = 'متصل';
      // تشغيل صوت الطرف الآخر
      const audio = new Audio();
      audio.srcObject = remoteStream;
      audio.play().catch(e=>console.log(e));
      window._remoteAudio = audio;
    }
    startCallTimer();
  });
  
  call.on('close', () => {
    endCall();
    endVideoCall();
  });
  
  call.on('error', (err) => {
    console.error('خطأ مكالمة:', err);
    alert('خطأ في المكالمة');
    endCall();
    endVideoCall();
  });
}

function acceptIncomingCall() {
  if (!incomingCallData) return;
  document.getElementById('incomingCall').classList.remove('active');
  try { document.getElementById('ringtone').pause(); } catch(e){}
  
  const type = incomingCallData.metadata && incomingCallData.metadata.type ? incomingCallData.metadata.type : 'audio';
  
  navigator.mediaDevices.getUserMedia(type === 'video' ? {video:true, audio:true} : {audio:true})
    .then(stream => {
      localStream = stream;
      if (type === 'video') {
        document.getElementById('selfVideo').srcObject = stream;
        document.getElementById('videoModal').classList.add('active');
      } else {
        document.getElementById('callModal').classList.add('active');
      }
      incomingCallData.answer(stream);
      currentCall = incomingCallData;
      setupCallHandlers(currentCall, type);
      incomingCallData = null;
    })
    .catch(err => {
      alert('لا يمكن الوصول للوسائط: ' + err.message);
      incomingCallData = null;
    });
}

function rejectIncomingCall() {
  if (incomingCallData) {
    incomingCallData.close();
    incomingCallData = null;
  }
  document.getElementById('incomingCall').classList.remove('active');
  try { document.getElementById('ringtone').pause(); } catch(e){}
}

function endCall() {
  document.getElementById('callModal').classList.remove('active');
  if (currentCall) { currentCall.close(); currentCall = null; }
  if (localStream && !document.getElementById('videoModal').classList.contains('active')) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  if (window._remoteAudio) { window._remoteAudio = null; }
  clearInterval(callTimer);
  if (conn && conn.open) conn.send({ type:'call-end' });
}

function endVideoCall() {
  document.getElementById('videoModal').classList.remove('active');
  if (currentCall) { currentCall.close(); currentCall = null; }
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  clearInterval(callTimer);
  if (conn && conn.open) conn.send({ type:'call-end' });
}

function startCallTimer() {
  callSeconds = 0;
  callTimer = setInterval(() => {
    callSeconds++;
    const m = String(Math.floor(callSeconds/60)).padStart(2,'0');
    const s = String(callSeconds%60).padStart(2,'0');
    const timeStr = m+':'+s;
    document.getElementById('callStatus').textContent = 'متصل - ' + timeStr;
    document.getElementById('videoTime').textContent = timeStr;
  }, 1000);
}

function toggleMute() {
  const btn = document.getElementById('muteBtn');
  if (localStream) {
    const track = localStream.getAudioTracks()[0];
    if (track) {
      track.enabled = !track.enabled;
      btn.textContent = track.enabled ? '🎤' : '🔇';
    }
  }
}

function toggleVideoMute() {
  if (localStream) {
    const track = localStream.getAudioTracks()[0];
    if (track) track.enabled = !track.enabled;
  }
}

function toggleCamera() {
  if (localStream) {
    const track = localStream.getVideoTracks()[0];
    if (track) track.enabled = !track.enabled;
  }
}
